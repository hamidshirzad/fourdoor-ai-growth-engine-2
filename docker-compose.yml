services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fourdoor_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fourdoor_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fourdoor_ai
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_STARTER_PLAN_ID: ${PAYPAL_STARTER_PLAN_ID:-}
      PAYPAL_PRO_PLAN_ID: ${PAYPAL_PRO_PLAN_ID:-}
      PAYPAL_AGENCY_PLAN_ID: ${PAYPAL_AGENCY_PLAN_ID:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_AGENCY_PRICE_ID: ${STRIPE_AGENCY_PRICE_ID:-}
      CALENDLY_BOOKING_URL: ${CALENDLY_BOOKING_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data:
