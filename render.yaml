# Render Blueprint for the Fourdoor AI Growth Engine production backend.
#
# Creates three resources in Frankfurt:
#   1. Express API web service
#   2. Dedicated automation background worker
#   3. Managed Render Postgres with PgBouncer
#
# The frontend/control plane remains on Vercel. Do not put secrets in this file.

previews:
  generation: off

databases:
  - name: fourdoor-growth-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: fourdoor_growth
    user: fourdoor_growth
    connectionPool: pgbouncer
    storageAutoscalingEnabled: true

services:
  - type: web
    name: fourdoor-growth-api
    runtime: node
    plan: starter
    region: frankfurt
    repo: https://github.com/hamidshirzad/fourdoor-ai-growth-engine-2
    branch: ops/control-plane-bridge
    rootDir: backend
    buildCommand: npm ci
    # Database migrations belong in Render's paid pre-deploy phase, not in the
    # process start command. A failed migration fails the deployment without
    # putting the running service into a restart loop.
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 45
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fourdoor-growth-db
          property: connectionPoolString
      - key: DATABASE_POOL_MIN
        value: "0"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://www.fourdoorai.com,https://fourdoorai.com
      - key: FRONTEND_URL
        value: https://fourdoorai.com

      # Shared HMAC secret for FourdoorAI Ops -> Growth Engine internal calls.
      # Generate with: openssl rand -hex 32
      # Set the identical value in the Vercel fourdooraiops Production env.
      - key: FOURDOOR_INTERNAL_SHARED_SECRET
        sync: false

      # Keep the API schedulers awake on the paid web service so campaigns can
      # enqueue durable automation_jobs. Execution is handled by the worker.
      - key: DISABLE_SCHEDULERS
        value: "false"
      - key: AUTOMATION_WORKER_ENABLED
        value: "false"

      # AI is optional at boot, but production agent execution should have this.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # Optional Firestore projection. Postgres remains the source of truth.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: worker
    name: fourdoor-growth-worker
    runtime: node
    plan: starter
    region: frankfurt
    repo: https://github.com/hamidshirzad/fourdoor-ai-growth-engine-2
    branch: ops/control-plane-bridge
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run worker
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fourdoor-growth-db
          property: connectionPoolString
      - key: DATABASE_POOL_MIN
        value: "0"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: AUTOMATION_WORKER_ENABLED
        value: "true"
      - key: AUTOMATION_WORKER_BATCH_SIZE
        value: "5"
      - key: AUTOMATION_WORKER_POLL_MS
        value: "30000"
      - key: AUTOMATION_WORKER_STALE_LOCK_MINUTES
        value: "30"
      - key: AUTOMATION_LEAD_FOLLOW_UP_LIMIT
        value: "5"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
