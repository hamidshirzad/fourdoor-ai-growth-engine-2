# Netlify configuration for the Next.js frontend.
#
# The frontend is hosted here; the Express API is a SEPARATE service (see
# render.yaml). They live on different origins, which is why the frontend needs
# NEXT_PUBLIC_API_URL pointing at the API, and the API needs CORS_ORIGIN
# pointing back at this site.
#
# This site is the intended standby. Vercel serves the fourdoorai.com custom
# domain; note the standby is NOT yet warm — the production context here has
# built successfully once (2026-08-02) and every attempt since has errored or
# been skipped. See DEPLOYMENT.md, "Frontend hosting".
#
# Netlify was set up when the Vercel account hit a plan/usage limit that killed
# every build during *resource provisioning* — dead in ~500 ms with zero
# build-log events, unfixable from the repository. Vercel deploys again, so the
# domain stayed there, and this site is kept building so it can take over.
#
# Because both hosts are live, NEXT_PUBLIC_API_URL has to be set in BOTH
# dashboards. See DEPLOYMENT.md, "Frontend hosting".

[build]
  # This repo is a monorepo. Without `base`, Netlify builds from the root, where
  # there is no Next.js app, and the deploy 404s.
  base = "frontend"
  # `npm install --workspaces=false` before the build is not redundant with the
  # install Netlify already runs. See the @netlify/blobs note below: Edge
  # Functions bundling only searches THIS directory's node_modules, and a plain
  # install in an npm workspace hoists everything to the repository root
  # instead, leaving frontend/node_modules empty.
  #
  # --workspaces=false makes npm treat frontend/ as a standalone project, so it
  # gets a normal (still hoisted, just rooted here) node_modules of its own.
  command = "npm install --workspaces=false && npm run build"
  # Relative to `base`, i.e. frontend/.next. The Next.js runtime plugin picks it
  # up from here and turns the server-rendered routes into functions.
  publish = ".next"

[build.environment]
  # Pin the major version rather than inheriting whatever Netlify defaults to.
  # backend/package.json already declares engines.node >= 20; keep them aligned.
  NODE_VERSION = "20"

# Required for Next.js on Netlify. Without it only static files are published
# and every SSR/API route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# frontend/package.json depends on @netlify/blobs even though no application
# code imports it.
#
# The User Agent Blocker extension (installed from the Netlify UI) injects a
# generated edge function, `ua_blocker_ef`, into frontend/.netlify/edge-functions
# at build time. With the extension's analytics option enabled — the
# USER_AGENT_BLOCKER_ANALYTICS variable in the resolved config — that function
# imports "@netlify/blobs" to record what it blocked.
#
# Edge Functions get npm modules through @netlify/edge-bundler. It cannot use
# normal resolution, because it bundles from a temp directory outside the
# project, so it passes esbuild an explicit search path instead. netlify-build
# calls it with only `basePath` (this `base` directory) and no `rootPath`, and
# edge-bundler defaults `rootPath` to `basePath` — so the search path is exactly
# one entry: frontend/node_modules. The repository root is NOT searched.
#
# That is why two changes are needed, and why either one alone still fails:
#
#   1. frontend/package.json must declare @netlify/blobs, and
#   2. the install must actually put it in frontend/node_modules, which is what
#      --workspaces=false in the build command above is for. This repo is an npm
#      workspace, so a plain `npm install` hoists every package to the
#      repository root and leaves frontend/node_modules empty — resolvable for
#      the Next.js build, invisible to Edge Functions bundling.
#
# An unresolvable import in a generated edge function is a hard failure:
# `Could not resolve "@netlify/blobs"`, exit code 2, no deploy. The site does
# not fall back to publishing without the extension.
#
# Do not drop the dependency as unused, and do not simplify the build command
# back to a plain `npm run build`; either one breaks deploys again for as long
# as the extension is installed.

# NEXT_PUBLIC_API_URL is deliberately NOT set here.
#
# It is a build-time value (Next.js inlines NEXT_PUBLIC_* into the bundle), so it
# must be set in the Netlify UI under Site configuration -> Environment variables
# BEFORE the build, and the site must be rebuilt after any change to it. Putting
# it in this file would hardcode one backend URL for every branch and deploy
# preview.
#
# When it is unset the login page says so and disables itself, rather than
# posting to this Netlify site where /api/auth/login does not exist.
